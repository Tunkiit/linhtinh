<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hôm Nay Ăn Gì? - Vòng Quay Chọn Món</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Montserrat:wght@700;800;900&display=swap');
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #111827 0%, #172554 45%, #312e81 100%);
      background-size: 200% 200%;
      animation: backgroundFlow 18s ease-in-out infinite;
      color: #e7e9ea;
      min-height: 100vh;
    }
    @keyframes backgroundFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .glass-card {
      background: #16181c;
      border: 1px solid #2f3336;
    }
    .pointer {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 36px solid #10b981;
      filter: drop-shadow(0 4px 12px rgba(16, 185, 129, 0.6));
    }
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
    }
    .x-button {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      transition: all 0.3s;
    }
    .x-button:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
    }
    .form-input {
      background: #071b1d !important;
      border: 1px solid #6ee7b7 !important;
      color: #ffffff !important;
      caret-color: #a7f3d0;
      opacity: 1 !important;
    }
    .form-input::placeholder { color: #b7d8cc !important; opacity: 1; }
    .form-label { color: #d1fae5 !important; font-weight: 700; }
    .form-help { color: #a7f3d0 !important; }
    .form-input:focus {
      border-color: #6ee7b7 !important;
      box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.2);
      outline: none;
    }
    .form-select {
      background-color: #061618 !important;
      color: #ffffff !important;
      border-color: rgba(167, 243, 208, 0.45) !important;
    }
    .form-select:focus {
      border-color: #6ee7b7 !important;
      box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.2);
      outline: none;
    }
    
    /* Responsive: prevent horizontal overflow on phones */
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    @media (max-width: 768px) {
      body {
        padding-left: 12px !important;
        padding-right: 12px !important;
      }
      .glass-card {
        width: 100%;
        max-width: 100%;
        padding: 20px !important;
      }
      #wheelCanvas {
        display: block;
        width: min(100%, 320px) !important;
        max-width: 100% !important;
        height: auto !important;
      }
      #itemsContainer {
        max-width: 100%;
      }
      input, select, button {
        max-width: 100%;
      }
    }
  </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-between min-h-screen">

  <!-- Header -->
  <header class="text-center max-w-md w-full mb-4">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#1d9bf0]/10 border border-[#1d9bf0]/30 text-[#1d9bf0] text-xs font-semibold mb-2">
      <i class="fa-solid fa-utensils"></i> Giải quyết nỗi lo "Tối nay ăn gì?"
    </div>
    <h1 class="text-4xl font-extrabold text-white">
      Hôm Nay Ăn Gì?
    </h1>
    <p class="text-[#71767b] text-sm mt-1 font-medium">Bấm quay ➔ Trúng món ➔ Đi ăn thôi!</p>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-3xl flex flex-col gap-6 items-stretch">
    
    <!-- Top: Wheel Section -->
    <section class="glass-card rounded-2xl p-8 flex flex-col items-center justify-center relative">
      <div class="relative flex flex-col items-center my-2">
        <!-- Pointer -->
        <div class="pointer absolute -top-4 z-20"></div>
        
        <!-- Canvas Wheel -->
        <canvas id="wheelCanvas" width="400" height="400" class="rounded-full transition-all" style="filter: drop-shadow(0 10px 30px rgba(29, 155, 240, 0.2));"></canvas>
      </div>

      <!-- Spin Button -->
      <button id="spinBtn" onclick="spinWheel()" class="mt-6 px-12 py-3.5 x-button text-white font-bold text-base rounded-full shadow-lg transition-all transform hover:scale-105 active:scale-95 flex items-center gap-3">
        <i class="fa-solid fa-arrows-rotate text-lg" id="spinIcon"></i> QUAY NGAY
      </button>
      
      <!-- History Button -->
      <button onclick="openHistoryModal()" class="mt-3 px-6 py-2 bg-white/10 hover:bg-white/20 border border-white/30 text-white font-semibold text-sm rounded-full transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-clock-rotate-left"></i> Lịch sử (<span id="historyCount">0</span>)
      </button>
    </section>

    <!-- Bottom: Menu List & Customization -->
    <section class="glass-card rounded-2xl p-8 flex flex-col">
      <div>
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-list-check text-[#1d9bf0]"></i> Danh sách món (<span id="countSpan">0</span>)
          </h2>
          <button onclick="resetDefaults()" class="text-xs text-[#71767b] hover:text-[#1d9bf0] transition-colors font-semibold">
            <i class="fa-solid fa-rotate-left"></i> Mặc định
          </button>
        </div>

        <!-- Add Input -->
        <div class="flex flex-col sm:flex-row gap-3 mb-4">
          <input type="text" id="newItemInput" placeholder="Thêm món bạn thích..." class="form-input flex-1 rounded-lg px-4 py-3 text-sm transition-all">
          <button onclick="addItem()" class="x-button text-white font-bold px-6 py-3 rounded-lg transition-all text-sm flex items-center justify-center gap-2 min-h-[44px]">
            <i class="fa-solid fa-plus"></i> Thêm
          </button>
        </div>

        <!-- Items List -->
        <div id="itemsContainer" class="max-h-[280px] overflow-y-auto pr-1 space-y-3 custom-scrollbar">
          <!-- Dynamically populated -->
        </div>
      </div>

      <div class="mt-6 pt-4 border-t border-[#2f3336] text-xs text-[#71767b] text-center font-medium">
        💡 Đã chọn sẵn các món ăn tối phổ biến. Thêm/bớt tùy thích!
      </div>
    </section>

  </main>

  <!-- Modal Result -->
  <div id="resultModal" class="fixed inset-0 bg-[#5b7083]/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass-card max-w-md w-full rounded-2xl p-6 text-center border-[#2f3336]">
      <div class="w-16 h-16 bg-[#1d9bf0] text-white rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
        <i class="fa-solid fa-champagne-glasses"></i>
      </div>
      <p class="text-[#71767b] text-sm font-semibold uppercase tracking-wider mb-1">Quyết định tối nay là:</p>
      <h3 id="resultFood" class="text-4xl font-black text-white mb-4">
        Cơm Tấm
      </h3>

      <!-- Restaurant Selection -->
      <div id="restaurantSelection" class="mb-6 hidden">
        <p class="text-[#71767b] text-sm mb-3">Chọn quán bạn muốn đi:</p>
        <select id="restaurantSelect" class="form-select w-full border rounded-lg px-4 py-3 transition-all mb-3">
          <option value="">-- Chọn quán --</option>
        </select>
      </div>

      <div class="flex flex-col gap-3">
        <button id="openMapBtn" onclick="openSelectedMap()" class="w-full x-button text-white font-bold py-3.5 rounded-full transition-all shadow-lg flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-map-location-dot"></i> <span id="mapBtnText">Mở Google Maps</span>
        </button>
        <button id="searchOtherBtn" onclick="searchNearby()" class="w-full border border-[#2f3336] hover:bg-[#181a1d] text-[#1d9bf0] font-semibold py-3 rounded-full transition-all text-sm hidden">
          <i class="fa-solid fa-magnifying-glass"></i> Tìm quán khác gần đây
        </button>
        <button onclick="closeModal()" class="w-full border border-[#2f3336] hover:bg-[#181a1d] text-white font-semibold py-3 rounded-full transition-all text-sm">
          Quay lại chọn món khác
        </button>
      </div>
    </div>
  </div>

  <!-- Add Restaurant Modal -->
  <div id="addRestaurantModal" class="fixed inset-0 bg-[#5b7083]/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass-card max-w-md w-full rounded-2xl p-6 border-[#2f3336]">
      <h3 class="text-xl font-bold text-white mb-4">
        <i class="fa-solid fa-store text-[#1d9bf0]"></i> Thêm quán cho "<span id="addRestaurantDishName"></span>"
      </h3>
      
      <div class="space-y-4">
        <div>
          <label class="form-label text-sm mb-2 block">Tên quán:</label>
          <input type="text" id="restaurantNameInput" placeholder="VD: Cơm Tấm Bà Chiểu" class="form-input w-full rounded-lg px-4 py-3 text-sm transition-all">
        </div>
        
        <div>
          <label class="form-label text-sm mb-2 block">Link Google Maps (tùy chọn):</label>
          <input type="text" id="restaurantLinkInput" placeholder="https://maps.app.goo.gl/..." class="form-input w-full rounded-lg px-4 py-3 text-sm transition-all">
          <p class="form-help text-xs mt-1">💡 Để trống nếu chưa có link</p>
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="saveRestaurant()" class="flex-1 x-button text-white font-bold py-3 rounded-lg transition-all">
          <i class="fa-solid fa-check"></i> Lưu
        </button>
        <button onclick="closeAddRestaurantModal()" class="flex-1 border border-[#2f3336] hover:bg-[#181a1d] text-white font-semibold py-3 rounded-lg transition-all">
          Hủy
        </button>
      </div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="historyModal" class="fixed inset-0 bg-[#5b7083]/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass-card max-w-md w-full rounded-2xl p-6 border-[#2f3336]">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-white">
          <i class="fa-solid fa-clock-rotate-left text-[#10b981]"></i> Lịch sử món đã ăn
        </h3>
        <button onclick="closeHistoryModal()" class="text-white/70 hover:text-white transition-colors">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      
      <div id="historyContainer" class="max-h-[400px] overflow-y-auto pr-1 space-y-2 custom-scrollbar">
        <!-- Dynamically populated -->
      </div>

      <div class="mt-4 pt-4 border-t border-white/20 flex gap-3">
        <button onclick="clearHistory()" class="flex-1 border border-red-500/50 hover:bg-red-500/20 text-red-400 font-semibold py-2.5 rounded-lg transition-all text-sm">
          <i class="fa-solid fa-trash-can"></i> Xóa lịch sử
        </button>
        <button onclick="closeHistoryModal()" class="flex-1 border border-white/30 hover:bg-white/10 text-white font-semibold py-2.5 rounded-lg transition-all text-sm">
          Đóng
        </button>
      </div>
    </div>
  </div>

  <!-- Background music -->
  <audio id="bgm" loop preload="none" src="background-music.wav"></audio>
  <button id="bgmBtn" onclick="toggleBgm()" class="fixed bottom-5 right-5 w-12 h-12 rounded-full glass-card text-white text-lg z-40 flex items-center justify-center shadow-lg">
    <i id="bgmIcon" class="fa-solid fa-volume-xmark"></i>
  </button>

        { name: "Hải sản Bé Yến", link: "https://www.google.com/maps/search/?api=1&query=Hải+sản+Bé+Yến+45+Nguyễn+Sáng+Đà+Nẵng" },
        { name: "Mộc quán", link: "https://www.google.com/maps/search/?api=1&query=Mộc+quán+26+Tô+Hiến+Thành+Đà+Nẵng" }
      ] },
      { name: "Bánh Canh", restaurants: [
        { name: "Bánh canh cá lóc Yến", link: "https://www.google.com/maps/search/?api=1&query=Bánh+canh+cá+lóc+Yến+253+Nguyễn+Hoàng+Đà+Nẵng" },
        { name: "Bánh canh cua Quân Nguyễn", link: "https://www.google.com/maps/search/?api=1&query=Bánh+canh+cua+Quân+Nguyễn+24+Ông+Ích+Khiêm+Đà+Nẵng" },
        { name: "Bánh canh Cúc", link: "https://www.google.com/maps/search/?api=1&query=Bánh+canh+Cúc+82+Bùi+Dương+Lịch+Đà+Nẵng" }
      ] },
      { name: "Mì Quảng", restaurants: [
        { name: "Mì Quảng Dì Mỹ Phú Chiêm", link: "https://www.google.com/maps/search/?api=1&query=Mì+Quảng+Dì+Mỹ+Phú+Chiêm+176+Nguyễn+Công+Trứ+Đà+Nẵng" },
        { name: "Mì Quảng Bà Mua", link: "https://www.google.com/maps/search/?api=1&query=Mì+Quảng+Bà+Mua+Đà+Nẵng" },
        { name: "Mì Quảng Như", link: "https://www.google.com/maps/search/?api=1&query=Mì+Quảng+Như+63+Phạm+Văn+Nghị+Đà+Nẵng" },
        { name: "Mì Quảng Bà Vị", link: "https://www.google.com/maps/search/?api=1&query=Mì+Quảng+Bà+Vị+166+Lê+Đình+Dương+Đà+Nẵng" },
        { name: "Mì Quảng Bích", link: "https://www.google.com/maps/search/?api=1&query=Mì+Quảng+Bích+3+Đặng+Dung+Đà+Nẵng" }
      ] },
      { name: "Cháo & Cơm", restaurants: [
        { name: "Cháo vịt Cô Chủ Nhỏ", link: "https://www.google.com/maps/search/?api=1&query=Cháo+vịt+Cô+Chủ+Nhỏ+36+Phan+Tứ+Đà+Nẵng" },
        { name: "Cháo vịt Quán Nhân", link: "https://www.google.com/maps/search/?api=1&query=Cháo+vịt+Quán+Nhân+83+Phan+Tứ+Đà+Nẵng" },
        { name: "Cháo lòng Dì Bé", link: "https://www.google.com/maps/search/?api=1&query=Cháo+lòng+Dì+Bé+20+Mai+Lão+Bạng+Đà+Nẵng" },
        { name: "Cơm gà Tú Tài", link: "https://www.google.com/maps/search/?api=1&query=Cơm+gà+Tú+Tài+62+Hải+Phòng+Đà+Nẵng" },
        { name: "Cơm chiên giòn A Tý", link: "https://www.google.com/maps/search/?api=1&query=Cơm+chiên+giòn+A+Tý+215+Nguyễn+Chí+Thanh+Đà+Nẵng" },
        { name: "Mì A Chúng", link: "https://www.google.com/maps/search/?api=1&query=Mì+A+Chúng+35+Phạm+Hồng+Thái+Đà+Nẵng" },
        { name: "Cơm gà Hồng Ngọc", link: "https://www.google.com/maps/search/?api=1&query=Cơm+gà+Hồng+Ngọc+193+Nguyễn+Chí+Thanh+Đà+Nẵng" }
      ] }
    ];

    const savedItems = JSON.parse(localStorage.getItem('food_items_v2'));
    // Merge dữ liệu mặc định mới với dữ liệu đã lưu trên thiết bị.
    // Giữ quán người dùng thêm, đồng thời bổ sung quán mặc định mới.
    let items = JSON.parse(JSON.stringify(defaultItems));
    if (Array.isArray(savedItems)) {
      savedItems.forEach(saved => {
        const alias = { 'Bún Bò Huế': 'Bún Bò', 'Ốc & Ăn Vặt': 'Ăn Vặt', 'Bún Chả': 'Bún Chả / Bún Chả Cá', 'Bún Chả Cá': 'Bún Chả / Bún Chả Cá' };
        const savedName = alias[saved.name] || saved.name;
        const current = items.find(item => item.name === savedName);
        if (!current) {
          items.push(saved);
          return;
        }
        const savedRestaurants = Array.isArray(saved.restaurants) ? saved.restaurants : [];
        const known = new Set(current.restaurants.map(rest => `${rest.name}|${rest.link || ''}`));
        savedRestaurants.forEach(rest => {
          const key = `${rest.name}|${rest.link || ''}`;
          if (!known.has(key)) current.restaurants.push(rest);
        });
      });
    }
    let currentDishIndex = -1;
    let selectedDishIndex = -1;
    let history = JSON.parse(localStorage.getItem('food_history')) || [];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let isSpinning = false;
    let currentAngle = 0;

    // X-style gradient colors
    const gradientColors = [
      ['#1d9bf0', '#1a8cd8'],
      ['#1a8cd8', '#1470b8'],
      ['#7856ff', '#6a47e0'],
      ['#f91880', '#d01060'],
      ['#ff7a00', '#e06800'],
      ['#00ba7c', '#009a68'],
      ['#1d9bf0', '#0c7abf'],
      ['#8b98a5', '#71767b']
    ];

    function drawWheel() {
      const numItems = items.length;
      if (numItems === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#71767b';
        ctx.font = '16px Quicksand';
        ctx.textAlign = 'center';
        ctx.fillText('Hãy thêm ít nhất 1 món!', canvas.width / 2, canvas.height / 2);
        return;
      }

      const arc = (2 * Math.PI) / numItems;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numItems; i++) {
        const angle = currentAngle + i * arc;
        
        ctx.beginPath();
        const gradient = ctx.createLinearGradient(
          radius + radius * Math.cos(angle), 
          radius + radius * Math.sin(angle), 
          radius + radius * Math.cos(angle + arc), 
          radius + radius * Math.sin(angle + arc)
        );
        const colorset = gradientColors[i % gradientColors.length];
        gradient.addColorStop(0, colorset[0]);
        gradient.addColorStop(1, colorset[1]);
        
        ctx.fillStyle = gradient;

        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 8, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();
        
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.stroke();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px Quicksand';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 8;
        
        let text = items[i].name;
        if (text.length > 15) text = text.substring(0, 13) + '...';
        
        ctx.fillText(text, radius - 25, 5);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(radius, radius, 35, 0, 2 * Math.PI);
      ctx.fillStyle = '#000000';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#1d9bf0';
      ctx.stroke();

      // Center label: stable across browsers (emoji can render off-center)
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 13px Quicksand';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('QUAY', radius, radius);
    }

    function renderList() {
      const container = document.getElementById('itemsContainer');
      document.getElementById('countSpan').textContent = items.length;
      container.innerHTML = '';

      items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'border border-[#2f3336] rounded-lg overflow-hidden';
        
        const restaurantCount = item.restaurants ? item.restaurants.length : 0;
        
        div.innerHTML = `
          <div class="flex items-center justify-between px-4 py-3 hover:bg-[#181a1d] transition-all">
            <div class="flex-1">
              <div class="font-semibold text-white">${item.name}</div>
              ${restaurantCount > 0 ? `<div class="text-xs text-[#71767b] mt-1"><i class="fa-solid fa-store"></i> ${restaurantCount} quán đã lưu</div>` : ''}
            </div>
            <div class="flex items-center gap-2">
              <button onclick="openAddRestaurantModal(${index})" class="text-[#1d9bf0] hover:text-[#1a8cd8] p-2 transition-colors min-w-[44px] min-h-[44px] flex items-center justify-center" title="Thêm quán">
                <i class="fa-solid fa-plus"></i>
              </button>
              <button onclick="removeItem(${index})" class="text-[#71767b] hover:text-[#f91880] p-2 transition-colors min-w-[44px] min-h-[44px] flex items-center justify-center" title="Xóa món">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
          ${restaurantCount > 0 ? `
            <div class="border-t border-[#2f3336] px-4 py-2 bg-[#0d0f12]">
              ${item.restaurants.map((rest, restIndex) => `
                <div class="flex items-center justify-between py-2 text-sm text-[#71767b]">
                  <span class="flex-1"><i class="fa-solid fa-location-dot text-[#1d9bf0]"></i> ${rest.name}</span>
                  <button onclick="removeRestaurant(${index}, ${restIndex})" class="text-[#71767b] hover:text-[#f91880] p-1 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
              `).join('')}
            </div>
          ` : ''}
        `;
        container.appendChild(div);
      });

      saveItems();
      drawWheel();
    }

    function addItem() {
      const input = document.getElementById('newItemInput');
      const val = input.value.trim();
      if (val) {
        items.push({ name: val, restaurants: [] });
        input.value = '';
        renderList();
      }
    }

    document.getElementById('newItemInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addItem();
    });

    function removeItem(index) {
      items.splice(index, 1);
      renderList();
    }

    function resetDefaults() {
      items = JSON.parse(JSON.stringify(defaultItems));
      renderList();
    }

    function saveItems() {
      localStorage.setItem('food_items_v2', JSON.stringify(items));
    }

    function openAddRestaurantModal(dishIndex) {
      currentDishIndex = dishIndex;
      document.getElementById('addRestaurantDishName').textContent = items[dishIndex].name;
      document.getElementById('restaurantNameInput').value = '';
      document.getElementById('restaurantLinkInput').value = '';
      document.getElementById('addRestaurantModal').classList.remove('hidden');
      document.getElementById('addRestaurantModal').classList.add('flex');
    }

    function closeAddRestaurantModal() {
      document.getElementById('addRestaurantModal').classList.add('hidden');
      document.getElementById('addRestaurantModal').classList.remove('flex');
      currentDishIndex = -1;
    }

    function saveRestaurant() {
      const name = document.getElementById('restaurantNameInput').value.trim();
      const link = document.getElementById('restaurantLinkInput').value.trim();
      
      if (!name) {
        alert('Vui lòng nhập tên quán!');
        return;
      }

      if (!items[currentDishIndex].restaurants) {
        items[currentDishIndex].restaurants = [];
      }

      items[currentDishIndex].restaurants.push({
        name: name,
        link: link || null
      });

      renderList();
      closeAddRestaurantModal();
    }

    function removeRestaurant(dishIndex, restIndex) {
      items[dishIndex].restaurants.splice(restIndex, 1);
      renderList();
    }

    // Background music: trình duyệt chặn autoplay, nên chỉ bật sau 1 thao tác bấm
    const bgm = document.getElementById('bgm');
    const bgmIcon = document.getElementById('bgmIcon');
    let bgmOn = localStorage.getItem('bgm_on') === '1';
    bgm.volume = 0.35;

    function renderBgmIcon() {
      bgmIcon.className = bgmOn ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
    }
    function startBgm() { if (bgmOn) bgm.play().catch(() => {}); }
    function stopBgm() { bgm.pause(); }
    function toggleBgm() {
      bgmOn = !bgmOn;
      localStorage.setItem('bgm_on', bgmOn ? '1' : '0');
      renderBgmIcon();
      bgmOn ? startBgm() : stopBgm();
    }
    renderBgmIcon();

    function spinWheel() {
      if (isSpinning || items.length === 0) return;
      startBgm(); // có gesture người dùng -> bật được nhạc nếu đang bật
      isSpinning = true;

      const spinIcon = document.getElementById('spinIcon');
      spinIcon.classList.add('animate-spin');

      const spinRounds = 5 + Math.random() * 3;
      const targetAngle = currentAngle + spinRounds * 2 * Math.PI;

      const startTime = performance.now();
      const duration = 4000;

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = targetAngle * easeOut;

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinIcon.classList.remove('animate-spin');
          showResult();
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult() {
      const numItems = items.length;
      const arc = (2 * Math.PI) / numItems;
      
      let normalizedAngle = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      let selectedAngle = (1.5 * Math.PI - normalizedAngle) % (2 * Math.PI);
      if (selectedAngle < 0) selectedAngle += 2 * Math.PI;

      const selectedIndex = Math.floor(selectedAngle / arc) % numItems;
      selectedDishIndex = selectedIndex;
      const chosenDish = items[selectedIndex];

      // Lưu món vừa quay vào lịch sử, mới nhất ở trên
      history.unshift({ name: chosenDish.name, date: new Date().toISOString() });
      history = history.slice(0, 30);
      localStorage.setItem('food_history', JSON.stringify(history));
      document.getElementById('historyCount').textContent = history.length;

      document.getElementById('resultFood').textContent = chosenDish.name;

      // Show restaurant selection if available
      const restaurantSelection = document.getElementById('restaurantSelection');
      const restaurantSelect = document.getElementById('restaurantSelect');
      const searchOtherBtn = document.getElementById('searchOtherBtn');
      
      if (chosenDish.restaurants && chosenDish.restaurants.length > 0) {
        // Có quán đã lưu - hiện dropdown
        restaurantSelection.classList.remove('hidden');
        restaurantSelect.innerHTML = '<option value="">-- Chọn quán --</option>';
        chosenDish.restaurants.forEach((rest, index) => {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = rest.name;
          restaurantSelect.appendChild(option);
        });
        document.getElementById('mapBtnText').textContent = 'Mở quán đã chọn';
        searchOtherBtn.classList.remove('hidden'); // Hiện nút tìm quán khác
      } else {
        // Chưa có quán - chỉ search Google Maps
        restaurantSelection.classList.add('hidden');
        document.getElementById('mapBtnText').textContent = 'Tìm quán gần đây';
        searchOtherBtn.classList.add('hidden'); // Ẩn nút tìm quán khác
      }
      
      document.getElementById('resultModal').classList.remove('hidden');
      document.getElementById('resultModal').classList.add('flex');

      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#1d9bf0', '#7856ff', '#f91880', '#ff7a00', '#00ba7c']
      });
    }

    function openSelectedMap() {
      const chosenDish = items[selectedDishIndex];
      const restaurantSelect = document.getElementById('restaurantSelect');
      const selectedRestIndex = restaurantSelect.value;

      if (selectedRestIndex !== '' && chosenDish.restaurants && chosenDish.restaurants[selectedRestIndex]) {
        const restaurant = chosenDish.restaurants[selectedRestIndex];
        const rawLink = (restaurant.link || '').trim();
        const isUrl = rawLink.includes('.') && !rawLink.includes(' '); // supports maps.app.goo.gl

        if (isUrl) {
          const mapLink = /^https?:\/\//i.test(rawLink) ? rawLink : `https://${rawLink}`;
          // Mobile xử lý redirect/app link ổn định hơn khi điều hướng trực tiếp
          window.location.href = mapLink;
        } else {
          // Link trống hoặc sai định dạng: tìm theo tên quán
          window.location.href = `https://www.google.com/maps/search/${encodeURIComponent(restaurant.name)}`;
        }
      } else {
        searchNearby();
      }
    }

    function searchNearby() {
      const chosenDish = items[selectedDishIndex];
      window.location.href = `https://www.google.com/maps/search/${encodeURIComponent(chosenDish.name + ' gần đây')}`;
    }

    function closeModal() {
      document.getElementById('resultModal').classList.add('hidden');
      document.getElementById('resultModal').classList.remove('flex');
      selectedDishIndex = -1;
    }

    function openHistoryModal() {
      const container = document.getElementById('historyContainer');
      container.innerHTML = history.length
        ? history.map(entry => `<div class="flex justify-between gap-3 border border-white/20 rounded-lg px-3 py-2"><span class="text-white">${entry.name}</span><span class="text-xs text-white/60">${new Date(entry.date).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' })}</span></div>`).join('')
        : '<p class="text-center text-white/60 py-6">Chưa có món nào được quay.</p>';
      document.getElementById('historyModal').classList.remove('hidden');
      document.getElementById('historyModal').classList.add('flex');
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').classList.add('hidden');
      document.getElementById('historyModal').classList.remove('flex');
    }

    function clearHistory() {
      history = [];
      localStorage.removeItem('food_history');
      document.getElementById('historyCount').textContent = 0;
      openHistoryModal();
    }

    // Init
    document.getElementById('historyCount').textContent = history.length;
    renderList();
  </script>
</body>
